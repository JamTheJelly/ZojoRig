name: Build ZOJO RIG

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure (downloads JUCE automatically)
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect the finished app and plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/ZojoRig_artefacts/Release/Standalone/ZOJO RIG.exe" dist/
          Copy-Item -Recurse "build/ZojoRig_artefacts/Release/VST3/ZOJO RIG.vst3" dist/
          Copy-Item "docs/GETTING-STARTED.txt" dist/
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: Upload download package
        uses: actions/upload-artifact@v4
        with:
          name: ZOJO-RIG-Windows
          path: dist
          if-no-files-found: error
